# web starts only after mysqladmin ping succeeds.
# mysql has no published port. apache_conf is not the server.
# initial_admin.sql is not an init script.

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    environment:
      SECRET_KEY: ${SECRET_KEY}
      SECURITY_PASSWORD_SALT: ${SECURITY_PASSWORD_SALT}
      SECURITY_PASSWORD_HASH: ${SECURITY_PASSWORD_HASH:-argon2}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DATA_DB_NAME: ${DATA_DB_NAME}
      SEMANTIC_DB_NAME: ${SEMANTIC_DB_NAME:-}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER}
      FILE_FOLDER: ${FILE_FOLDER}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
      SPINAL_DATABASE_URI: ${SPINAL_DATABASE_URI:-}
      SPINAL_DB_NAME: ${SPINAL_DB_NAME:-}
    volumes:
      - uploads:${UPLOAD_FOLDER}
      - uploads:${FILE_FOLDER}

volumes:
  mysql-data:
  uploads:
